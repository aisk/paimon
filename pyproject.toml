[project]
name = "paimon"
version = "0.1.1"
description = "A minimal code agent built on pydantic-ai + textual"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.17.0",
    "textual>=8.2.7",
    "textual-serve>=1.1.3",
]

[project.scripts]
paimon = "paimon.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
