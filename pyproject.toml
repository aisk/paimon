[project]
name = "paimon"
version = "0.2.0"
description = "A minimal code agent built on pydantic-ai + textual"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.17.0",
    "textual>=8.2.7",
    "textual-serve>=1.1.3",
]

[project.scripts]
paimon = "paimon.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paimon"]

[tool.setuptools.package-data]
# The TUI stylesheet is loaded at runtime via PaimonApp.CSS_PATH, and the
# skill file is copied out by `paimon install-skill`, so the wheel has to
# carry both alongside the modules.
paimon = ["*.tcss", "skill/SKILL.md"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
